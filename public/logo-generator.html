<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Clarity Logo</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        .container {
            margin-top: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 12px;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #e53935;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Your High-Clarity Logo (With Glow)</h1>
    <p>Added the requested glow and gradient effects to match the original.</p>
    
    <div class="container">
        <img id="generated-logo" alt="Generating..." />
        <br/>
        <a id="download-btn" class="btn" href="#" download="triipholic-logo-red.png">Download Logo</a>
    </div>

    <script>
        window.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.src = 'logo.png';
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                
                // 1. Draw outer background with a glowing radial gradient
                const outerGradient = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, 0,
                    canvas.width / 2, canvas.height / 2, canvas.width * 0.8
                );
                outerGradient.addColorStop(0, '#a73042'); // Brighter red center
                outerGradient.addColorStop(1, '#5d1c25'); // Darker red edges
                
                ctx.fillStyle = outerGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 2. Draw the dark maroon rounded rectangle with shadow/glow
                const padding = canvas.width * 0.05; 
                const rectX = padding;
                const rectY = padding;
                const rectW = canvas.width - (padding * 2);
                const rectH = canvas.height - (padding * 2);
                const radius = canvas.width * 0.15;
                
                // Set shadow for the inner box
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = canvas.width * 0.05;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = canvas.height * 0.01;

                // Inner box gradient (slightly lighter in middle, dark edges)
                const innerGradient = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, 0,
                    canvas.width / 2, canvas.height / 2, canvas.width * 0.5
                );
                innerGradient.addColorStop(0, '#4a151b'); // Dark maroon center
                innerGradient.addColorStop(1, '#2f0b0f'); // Very dark edge
                
                ctx.fillStyle = innerGradient;
                ctx.beginPath();
                ctx.moveTo(rectX + radius, rectY);
                ctx.lineTo(rectX + rectW - radius, rectY);
                ctx.quadraticCurveTo(rectX + rectW, rectY, rectX + rectW, rectY + radius);
                ctx.lineTo(rectX + rectW, rectY + rectH - radius);
                ctx.quadraticCurveTo(rectX + rectW, rectY + rectH, rectX + rectW - radius, rectY + rectH);
                ctx.lineTo(rectX + radius, rectY + rectH);
                ctx.quadraticCurveTo(rectX, rectY + rectH, rectX, rectY + rectH - radius);
                ctx.lineTo(rectX, rectY + radius);
                ctx.quadraticCurveTo(rectX, rectY, rectX + radius, rectY);
                ctx.closePath();
                ctx.fill();
                
                // 3. Reset shadow for the logo and add a subtle white glow
                ctx.shadowColor = 'rgba(255, 255, 255, 0.2)';
                ctx.shadowBlur = canvas.width * 0.015;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // Get the final image data
                const dataUrl = canvas.toDataURL('image/png');
                
                // Update the DOM
                document.getElementById('generated-logo').src = dataUrl;
                document.getElementById('download-btn').href = dataUrl;
            };
        };
    </script>
</body>
</html>
